name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build site
        env:
          NEXT_PUBLIC_PLAYLISTS_CSV_URL: ${{ vars.NEXT_PUBLIC_PLAYLISTS_CSV_URL || secrets.NEXT_PUBLIC_PLAYLISTS_CSV_URL }}
          NEXT_PUBLIC_RECORDINGS_CSV_URL: ${{ vars.NEXT_PUBLIC_RECORDINGS_CSV_URL || secrets.NEXT_PUBLIC_RECORDINGS_CSV_URL }}
          NEXT_PUBLIC_TRACKS_CSV_URL: ${{ vars.NEXT_PUBLIC_TRACKS_CSV_URL || secrets.NEXT_PUBLIC_TRACKS_CSV_URL }}
        run: npm run build
        working-directory: web

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e


