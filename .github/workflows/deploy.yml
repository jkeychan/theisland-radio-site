name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.typecheck.json
        working-directory: web

      - name: Unit tests
        run: npm test -- --ci
        working-directory: web

  # Validates the Next.js build on PRs (no pages environment required)
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build site
        env:
          NEXT_PUBLIC_PLAYLISTS_CSV_URL: ${{ vars.NEXT_PUBLIC_PLAYLISTS_CSV_URL }}
          NEXT_PUBLIC_TRACKS_CSV_URL: ${{ vars.NEXT_PUBLIC_TRACKS_CSV_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_FORM_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build
        working-directory: web

  # Full build + publish, runs only on push to main
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Debug environment variables
        run: |
          echo "Checking environment variables..."
          if [ -z "$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" ]; then
            echo "NEXT_PUBLIC_RECAPTCHA_SITE_KEY is not set"
          else
            echo "NEXT_PUBLIC_RECAPTCHA_SITE_KEY is set (length: ${#NEXT_PUBLIC_RECAPTCHA_SITE_KEY})"
          fi
          if [ -z "$NEXT_PUBLIC_FORMSPREE_FORM_ID" ]; then
            echo "NEXT_PUBLIC_FORMSPREE_FORM_ID is not set"
          else
            echo "NEXT_PUBLIC_FORMSPREE_FORM_ID is set (length: ${#NEXT_PUBLIC_FORMSPREE_FORM_ID})"
          fi
          if [ -z "$NEXT_PUBLIC_TRACKS_CSV_URL" ]; then
            echo "NEXT_PUBLIC_TRACKS_CSV_URL is not set - homepage will not show This Week's Tracks"
          else
            echo "NEXT_PUBLIC_TRACKS_CSV_URL is set"
          fi
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_FORM_ID }}
          NEXT_PUBLIC_TRACKS_CSV_URL: ${{ vars.NEXT_PUBLIC_TRACKS_CSV_URL || secrets.NEXT_PUBLIC_TRACKS_CSV_URL }}

      - name: Build site
        env:
          NEXT_PUBLIC_PLAYLISTS_CSV_URL: ${{ vars.NEXT_PUBLIC_PLAYLISTS_CSV_URL || secrets.NEXT_PUBLIC_PLAYLISTS_CSV_URL }}
          NEXT_PUBLIC_TRACKS_CSV_URL: ${{ vars.NEXT_PUBLIC_TRACKS_CSV_URL || secrets.NEXT_PUBLIC_TRACKS_CSV_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_FORM_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build
        working-directory: web

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
